name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stack-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p build/verification
      - run: bash scripts/verify.sh docs 2>&1 | tee build/verification/docs.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs-evidence
          path: build/verification/
          retention-days: 7

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: bash scripts/verify.sh backend
      - name: Package the verified backend
        env:
          DEPLOY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci_component.py crackcs-backend
      - name: Preserve backend deployment payload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: deployment-crackcs-backend-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/deployment/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-evidence
          path: |
            build/test-results/test/
            build/reports/tests/test/
            build/reports/problems/
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: front/.nvmrc
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: bash scripts/verify.sh frontend
      - name: Package the verified frontend
        env:
          DEPLOY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci_component.py crackcs-frontend
      - name: Preserve frontend deployment payload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: deployment-crackcs-frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/deployment/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-evidence
          path: front/test-results/
          retention-days: 7

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: bash scripts/verify.sh postgres
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-evidence
          path: |
            build/test-results/postgresTest/
            build/reports/tests/postgresTest/
            build/reports/retrieval/postgres/
          retention-days: 7

  verify:
    name: CrackCS verify
    if: always()
    needs: [stack-docs, backend, frontend, postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          results = json.loads(os.environ['RESULTS'])
          for name, job in results.items():
              print(f"{name}: {job['result']}")
          if len(results) != 4 or any(job['result'] != 'success' for job in results.values()):
              raise SystemExit('All four verification jobs must succeed; skipped and cancelled jobs fail the gate.')
          PY
