plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'crackCS Spring Boot project'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Web
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-aspectj'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	// Persistence
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-h2console'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'

	// Code generation
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// Version managed by the Spring Boot BOM (currently Testcontainers 2.0.5).
	testRuntimeOnly 'org.testcontainers:testcontainers-postgresql'
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'retrieval-benchmark', 'postgres', 'local-service-latency-benchmark', 'http-latency-benchmark', 'ollama-live'
	}
}

def referenceDirectory = layout.projectDirectory.dir('docs/evaluation/reference-v1')

tasks.register('ollamaLiveEvaluation', Test) {
	group = 'verification'
	description = 'Measure a small reference-v1 sample with the locally running Ollama model.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	dependsOn 'verifyReferenceStandard'
	useJUnitPlatform { includeTags 'ollama-live' }
	testLogging.showStandardStreams = true
	systemProperty 'reference.directory', referenceDirectory.asFile.absolutePath
	systemProperty 'ollama.split', providers.gradleProperty('ollamaSplit').orElse('development').get()
	systemProperty 'ollama.case.limit', providers.gradleProperty('ollamaCaseLimit').orElse('4').get()
	systemProperty 'ollama.reasoning.effort', providers.gradleProperty('ollamaReasoningEffort').orElse('medium').get()
	systemProperty 'benchmark.output', providers.gradleProperty('ollamaReport')
		.orElse(layout.buildDirectory.file('reports/evaluation/ollama-smoke.json').get().asFile.absolutePath).get()
	maxParallelForks = 1
	outputs.upToDateWhen { false }
}

tasks.register('verifyReferenceStandard', Exec) {
	group = 'verification'
	description = 'Verify the frozen answer reference before measuring retrieval.'
	commandLine 'python3', referenceDirectory.file('tools/bundle.py').asFile.absolutePath
}

tasks.register('retrievalBenchmark', Test) {
	group = 'verification'
	description = 'Measure current retrieval against the frozen corpus on isolated H2.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	dependsOn 'verifyReferenceStandard'
	useJUnitPlatform { includeTags 'retrieval-benchmark' }
	systemProperty 'spring.profiles.active', 'retrieval-benchmark'
	systemProperty 'spring.datasource.url', 'jdbc:h2:mem:retrieval_benchmark;DB_CLOSE_DELAY=-1'
	systemProperty 'spring.datasource.driver-class-name', 'org.h2.Driver'
	systemProperty 'spring.datasource.username', 'sa'
	systemProperty 'spring.datasource.password', ''
	systemProperty 'spring.jpa.hibernate.ddl-auto', 'create-drop'
	systemProperty 'spring.sql.init.mode', 'never'
	systemProperty 'crackcs.evaluation.openai.enabled', 'false'
	systemProperty 'reference.directory', referenceDirectory.asFile.absolutePath
	systemProperty 'benchmark.output', layout.buildDirectory.dir('reports/retrieval/h2').get().asFile.absolutePath
	outputs.upToDateWhen { false }
}

tasks.register('localServiceLatencyBenchmark', Test) {
	group = 'verification'
	description = 'Measure local service and evaluation latency on isolated H2.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform { includeTags 'local-service-latency-benchmark' }
	systemProperty 'spring.profiles.active', 'test'
	systemProperty 'spring.datasource.url', 'jdbc:h2:mem:local_service_latency;DB_CLOSE_DELAY=-1'
	systemProperty 'spring.datasource.driver-class-name', 'org.h2.Driver'
	systemProperty 'spring.datasource.username', 'sa'
	systemProperty 'spring.datasource.password', ''
	systemProperty 'spring.jpa.hibernate.ddl-auto', 'create-drop'
	systemProperty 'spring.sql.init.mode', 'never'
	systemProperty 'crackcs.evaluation.openai.enabled', 'false'
	systemProperty 'crackcs.followup.openai.enabled', 'false'
	systemProperty 'crackcs.evaluation.worker-enabled', 'false'
	systemProperty 'crackcs.followup.worker-enabled', 'false'
	systemProperty 'benchmark.output', layout.buildDirectory.dir('reports/local-service-latency').get().asFile.absolutePath
	maxParallelForks = 1
	outputs.upToDateWhen { false }
}

tasks.register('postgresTest', Test) {
	group = 'verification'
	description = 'Run PostgreSQL 17 integration checks and retrieval measurement; Docker is required.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	dependsOn 'verifyReferenceStandard'
	useJUnitPlatform()
	filter {
		includeTestsMatching '*PostgresPersistenceTest'
		includeTestsMatching '*VersionConcurrencyTest'
		includeTestsMatching '*LearningProgressServiceTest'
		includeTestsMatching '*KnowledgeCompletionTest'
		includeTestsMatching '*KnowledgeAnswerSerializationTest'
		includeTestsMatching '*KnowledgeChunkServiceTest'
		includeTestsMatching '*KnowledgeRetrievalServiceTest'
		includeTestsMatching '*RetrievalBenchmarkTest'
		includeTestsMatching '*AnswerServiceTest'
		includeTestsMatching '*LoginAttemptServiceTest'
	}
	systemProperty 'spring.datasource.url', 'jdbc:tc:postgresql:17-alpine:///crackcs_test'
	systemProperty 'spring.profiles.active', 'postgres-test'
	systemProperty 'spring.datasource.driver-class-name', 'org.testcontainers.jdbc.ContainerDatabaseDriver'
	systemProperty 'spring.datasource.username', 'test'
	systemProperty 'spring.datasource.password', 'test'
	systemProperty 'spring.jpa.hibernate.ddl-auto', 'create-drop'
	systemProperty 'spring.sql.init.mode', 'never'
	systemProperty 'crackcs.evaluation.openai.enabled', 'false'
	systemProperty 'benchmark.database', 'PostgreSQL'
	systemProperty 'reference.directory', referenceDirectory.asFile.absolutePath
	systemProperty 'benchmark.output', layout.buildDirectory.dir('reports/retrieval/postgres').get().asFile.absolutePath
	maxParallelForks = 1
	outputs.upToDateWhen { false }
}


tasks.register('httpLatencyBenchmark', Test) {
    group = 'verification'
    description = 'Measure authenticated loopback HTTP latency on isolated PostgreSQL 17.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'http-latency-benchmark' }
    systemProperty 'spring.datasource.url', 'jdbc:tc:postgresql:17-alpine:///crackcs_http_test'
    systemProperty 'spring.datasource.driver-class-name', 'org.testcontainers.jdbc.ContainerDatabaseDriver'
    systemProperty 'spring.datasource.username', 'test'
    systemProperty 'spring.datasource.password', 'test'
    systemProperty 'spring.jpa.hibernate.ddl-auto', 'create-drop'
    systemProperty 'spring.sql.init.mode', 'never'
    systemProperty 'benchmark.output', layout.buildDirectory.file('reports/http-latency/result.json').get().asFile.absolutePath
    maxParallelForks = 1
    outputs.upToDateWhen { false }
}
