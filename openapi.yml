openapi: 3.1.0
info:
  title: CrackCS API
  version: 5.0.0
  description: 세션 인증, 콘텐츠 운영, 근거 검색과 구조화 평가 API
servers:
  - url: /
tags:
  - name: Answers
    description: 학습자 답변과 평가 상태
  - name: Authentication
    description: LOCAL 회원가입과 서버 세션 인증
  - name: Members
    description: 현재 인증 회원 조회
  - name: Public Questions
    description: 학습자에게 공개된 문제 조회
  - name: Admin Questions
    description: 관리자 문제 관리
  - name: Admin Members
    description: 관리자 회원 상태 관리
  - name: Admin Taxonomy
    description: 관리자 Topic과 Concept 관리
  - name: Admin Knowledge
    description: 관리자 KnowledgeDocument 버전과 공개 상태 관리
  - name: Admin Evaluations
    description: 실패·검토 필요 평가 조회
paths:
  /api/auth/csrf:
    get:
      tags: [Authentication]
      operationId: issueCsrfToken
      summary: CSRF token 발급
      security: []
      responses:
        '200':
          description: 상태 변경 요청에 사용할 CSRF token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
  /api/auth/sign-up:
    post:
      tags: [Authentication]
      operationId: signUp
      summary: LOCAL 회원가입
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: 회원가입 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/DuplicateAuthAccount'
  /api/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: 이메일과 비밀번호 로그인
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공과 session 생성
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
  /api/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: 현재 session 로그아웃
      responses:
        '204':
          description: session 무효화 성공
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/members/me:
    get:
      tags: [Members]
      operationId: findCurrentMember
      summary: 현재 회원과 역할 조회
      responses:
        '200':
          description: 현재 인증 회원
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/admin/members:
    get:
      tags: [Admin Members]
      operationId: findAdminMembers
      summary: 회원 목록 조회
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: 회원 페이지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPageResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/members/{memberId}/status:
    parameters:
      - $ref: '#/components/parameters/MemberIdPath'
    patch:
      tags: [Admin Members]
      operationId: changeMemberStatus
      summary: 회원 상태 변경
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberStatusUpdateRequest'
      responses:
        '200':
          description: 변경된 회원
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/topics:
    get:
      tags: [Admin Taxonomy]
      operationId: findAdminTopics
      summary: Topic 목록 조회
      parameters:
        - $ref: '#/components/parameters/ParentIdQuery'
        - $ref: '#/components/parameters/ActiveQuery'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: Topic 페이지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicPageResponse'
    post:
      tags: [Admin Taxonomy]
      operationId: createTopic
      summary: Topic 등록
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopicRequest'
      responses:
        '201':
          description: 생성된 Topic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicResponse'
        '409':
          $ref: '#/components/responses/ContentConflict'
  /api/admin/topics/{topicId}:
    parameters:
      - $ref: '#/components/parameters/TopicIdPath'
    get:
      tags: [Admin Taxonomy]
      operationId: findTopicById
      responses:
        '200':
          description: Topic 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicResponse'
    patch:
      tags: [Admin Taxonomy]
      operationId: updateTopic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopicRequest'
      responses:
        '200':
          description: 변경된 Topic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicResponse'
        '409':
          $ref: '#/components/responses/ContentConflict'
  /api/admin/topics/{topicId}/deactivate:
    parameters:
      - $ref: '#/components/parameters/TopicIdPath'
    post:
      tags: [Admin Taxonomy]
      operationId: deactivateTopic
      responses:
        '204':
          description: Topic 비활성화 완료
  /api/admin/concepts:
    get:
      tags: [Admin Taxonomy]
      operationId: findAdminConcepts
      parameters:
        - $ref: '#/components/parameters/TopicIdQuery'
        - $ref: '#/components/parameters/ActiveQuery'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: Concept 페이지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConceptPageResponse'
    post:
      tags: [Admin Taxonomy]
      operationId: createConcept
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConceptRequest'
      responses:
        '201':
          description: 생성된 Concept
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConceptResponse'
        '409':
          $ref: '#/components/responses/ContentConflict'
  /api/admin/concepts/{conceptId}:
    parameters:
      - $ref: '#/components/parameters/ConceptIdPath'
    get:
      tags: [Admin Taxonomy]
      operationId: findConceptById
      responses:
        '200':
          description: Concept 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConceptResponse'
    patch:
      tags: [Admin Taxonomy]
      operationId: updateConcept
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConceptRequest'
      responses:
        '200':
          description: 변경된 Concept
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConceptResponse'
        '409':
          $ref: '#/components/responses/ContentConflict'
  /api/admin/concepts/{conceptId}/deactivate:
    parameters:
      - $ref: '#/components/parameters/ConceptIdPath'
    post:
      tags: [Admin Taxonomy]
      operationId: deactivateConcept
      responses:
        '204':
          description: Concept 비활성화 완료
  /api/questions:
    get:
      tags:
        - Public Questions
      operationId: findPublicQuestions
      summary: 공개 문제 목록 조회
      description: PUBLISHED 상태인 문제만 페이지 단위로 조회한다.
      parameters:
        - $ref: '#/components/parameters/TopicIdQuery'
        - $ref: '#/components/parameters/DifficultyQuery'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - $ref: '#/components/parameters/PublicSortQuery'
      responses:
        '200':
          description: 공개 문제 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicQuestionPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/questions/{questionId}:
    parameters:
      - $ref: '#/components/parameters/QuestionIdPath'
    get:
      tags:
        - Public Questions
      operationId: findPublicQuestionById
      summary: 공개 문제 상세 조회
      description: PUBLISHED 상태인 문제만 조회하며, 비공개 문제와 존재하지 않는 문제를 동일하게 처리한다.
      responses:
        '200':
          description: 공개 문제 상세 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicQuestionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/QuestionNotFound'
  /api/admin/knowledge-documents:
    get:
      tags: [Admin Knowledge]
      operationId: findKnowledgeDocuments
      parameters:
        - $ref: '#/components/parameters/TopicIdQuery'
        - $ref: '#/components/parameters/DocumentStatusQuery'
        - $ref: '#/components/parameters/TechnologyVersionQuery'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: KnowledgeDocument 페이지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeDocumentPageResponse'
    post:
      tags: [Admin Knowledge]
      operationId: createKnowledgeDocument
      summary: 최초 DRAFT 문서 등록
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeDocumentRequest'
      responses:
        '201':
          description: 생성된 문서
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeDocumentResponse'
        '409':
          $ref: '#/components/responses/ContentConflict'
  /api/admin/knowledge-documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/DocumentIdPath'
    get:
      tags: [Admin Knowledge]
      operationId: findKnowledgeDocumentById
      responses:
        '200':
          description: 문서 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeDocumentResponse'
    patch:
      tags: [Admin Knowledge]
      operationId: updateKnowledgeDocument
      summary: DRAFT 문서 수정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeDocumentRequest'
      responses:
        '200':
          description: 변경된 문서
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeDocumentResponse'
        '409':
          $ref: '#/components/responses/ContentConflict'
  /api/admin/knowledge-documents/{documentId}/versions:
    parameters:
      - $ref: '#/components/parameters/DocumentIdPath'
    post:
      tags: [Admin Knowledge]
      operationId: createKnowledgeDocumentVersion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeDocumentRequest'
      responses:
        '201':
          description: 같은 계열의 새 DRAFT 버전
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeDocumentResponse'
        '409':
          $ref: '#/components/responses/ContentConflict'
  /api/admin/knowledge-documents/{documentId}/review:
    parameters:
      - $ref: '#/components/parameters/DocumentIdPath'
    post:
      tags: [Admin Knowledge]
      operationId: reviewKnowledgeDocument
      responses:
        '200':
          description: 검수 정보가 기록된 문서
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeDocumentResponse'
        '409':
          $ref: '#/components/responses/ContentConflict'
  /api/admin/knowledge-documents/{documentId}/publish:
    parameters:
      - $ref: '#/components/parameters/DocumentIdPath'
    post:
      tags: [Admin Knowledge]
      operationId: publishKnowledgeDocument
      responses:
        '200':
          description: 공개된 문서. 같은 계열의 이전 공개본은 RETIRED가 된다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeDocumentResponse'
        '409':
          $ref: '#/components/responses/ContentConflict'
  /api/admin/knowledge-documents/{documentId}/retire:
    parameters:
      - $ref: '#/components/parameters/DocumentIdPath'
    post:
      tags: [Admin Knowledge]
      operationId: retireKnowledgeDocument
      responses:
        '200':
          description: RETIRED 문서
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeDocumentResponse'
        '409':
          $ref: '#/components/responses/ContentConflict'
  /api/admin/knowledge-documents/{documentId}/chunks:
    parameters:
      - $ref: '#/components/parameters/DocumentIdPath'
    post:
      tags: [Admin Knowledge]
      operationId: generateKnowledgeChunks
      summary: 공개 문서의 검색 Chunk 생성 또는 기존 생성 결과 재사용
      responses:
        '200':
          description: Chunk 생성 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkGenerationResponse'
        '409':
          $ref: '#/components/responses/ContentConflict'
    get:
      tags: [Admin Knowledge]
      operationId: findKnowledgeChunks
      summary: 문서의 Chunk와 검색 상태 조회
      responses:
        '200':
          description: 원문 순서의 Chunk 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeChunkResponse'
  /api/admin/evaluations:
    get:
      tags: [Admin Evaluations]
      operationId: findReviewEvaluations
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [FAILED, NEEDS_REVIEW]
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: 실패·검토 필요 평가 페이지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEvaluationPageResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/evaluations/{evaluationId}:
    parameters:
      - name: evaluationId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    get:
      tags: [Admin Evaluations]
      operationId: findReviewEvaluationById
      responses:
        '200':
          description: 답변 원문과 검색 근거를 포함한 관리자 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEvaluationDetailResponse'
        '404':
          description: 평가 없음 또는 검토 대상 아님
  /api/admin/questions:
    get:
      tags:
        - Admin Questions
      operationId: findQuestions
      summary: 문제 목록 조회
      description: 조건에 맞는 문제를 페이지 단위로 조회한다.
      parameters:
        - $ref: '#/components/parameters/TopicIdQuery'
        - $ref: '#/components/parameters/StatusQuery'
        - $ref: '#/components/parameters/DifficultyQuery'
        - $ref: '#/components/parameters/OriginQuery'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - $ref: '#/components/parameters/SortQuery'
      responses:
        '200':
          description: 문제 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags:
        - Admin Questions
      operationId: createQuestion
      summary: 초안 문제 등록
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionCreateRequest'
      responses:
        '201':
          description: 문제 등록 성공
          headers:
            Location:
              description: 생성된 문제의 URI
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/admin/questions/{questionId}:
    parameters:
      - $ref: '#/components/parameters/QuestionIdPath'
    get:
      tags:
        - Admin Questions
      operationId: findQuestionById
      summary: 문제 상세 조회
      responses:
        '200':
          description: 문제 상세 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/QuestionNotFound'
    patch:
      tags:
        - Admin Questions
      operationId: updateQuestion
      summary: 초안 문제 수정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionUpdateRequest'
      responses:
        '200':
          description: 문제 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/QuestionNotFound'
  /api/admin/questions/{questionId}/concepts:
    parameters:
      - $ref: '#/components/parameters/QuestionIdPath'
    put:
      tags: [Admin Questions]
      operationId: replaceQuestionConcepts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionConceptReplaceRequest'
      responses:
        '200':
          description: 평가 Concept이 교체된 DRAFT 문제
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionResponse'
        '409':
          $ref: '#/components/responses/ContentConflict'
  /api/admin/questions/{questionId}/review:
    parameters:
      - $ref: '#/components/parameters/QuestionIdPath'
    post:
      tags: [Admin Questions]
      operationId: reviewQuestion
      responses:
        '200':
          description: 검수 정보가 기록된 문제
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionResponse'
        '409':
          $ref: '#/components/responses/ContentConflict'
  /api/admin/questions/{questionId}/publish:
    parameters:
      - $ref: '#/components/parameters/QuestionIdPath'
    post:
      tags: [Admin Questions]
      operationId: publishQuestion
      responses:
        '200':
          description: 공개된 문제
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionResponse'
        '409':
          $ref: '#/components/responses/ContentConflict'
  /api/admin/questions/{questionId}/retire:
    parameters:
      - $ref: '#/components/parameters/QuestionIdPath'
    post:
      tags: [Admin Questions]
      operationId: retireQuestion
      responses:
        '200':
          description: RETIRED 문제
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionResponse'
        '409':
          $ref: '#/components/responses/ContentConflict'
  /api/admin/questions/{questionId}/versions:
    parameters:
      - $ref: '#/components/parameters/QuestionIdPath'
    post:
      tags: [Admin Questions]
      operationId: createQuestionVersion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionVersionRequest'
      responses:
        '201':
          description: 평가 Concept을 복사한 새 DRAFT 문제 버전
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionResponse'
        '409':
          $ref: '#/components/responses/ContentConflict'
  /api/questions/{questionId}/answers:
    parameters:
      - $ref: '#/components/parameters/QuestionIdPath'
    post:
      tags: [Answers]
      operationId: submitAnswer
      summary: USER 답변 저장과 평가 접수
      description: 같은 회원의 동일 키·동일 문제·동일 원문은 기존 결과 반환. 다른 payload는 409. 재답변은 새 키 사용.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        - name: X-CSRF-TOKEN
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 10000
                  description: 공백만 있는 값 거부. 원문 공백 보존.
      responses:
        '202':
          description: 저장된 답변과 현재 평가 상태. 재요청 시 이미 완료된 상태 가능.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerResponse'
        '400':
          description: 필수 헤더 누락 또는 입력 오류
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/QuestionNotFound'
        '409':
          description: 같은 키의 다른 문제 또는 답변 원문
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/members/me/answers:
    get:
      tags: [Answers]
      operationId: findMyAnswers
      summary: USER 본인의 답변 이력
      description: submittedAt DESC, answerId DESC 고정 정렬
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: 답변 이력 페이지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerPageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/answers/{answerId}:
    parameters:
      - $ref: '#/components/parameters/AnswerIdPath'
    get:
      tags: [Answers]
      operationId: findMyAnswer
      summary: USER 본인의 답변 상세
      responses:
        '200':
          description: 폐기된 문제의 본문도 이력에서 제공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 답변 없음 또는 다른 회원 소유
  /api/answers/{answerId}/evaluation:
    parameters:
      - $ref: '#/components/parameters/AnswerIdPath'
    get:
      tags: [Answers]
      operationId: findMyEvaluation
      summary: USER 본인의 평가 상태와 결과
      description: 평가 상태, 구조화 피드백과 실제 사용 근거를 제공.
      responses:
        '200':
          description: 평가 진행·완료·실패 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 답변 없음 또는 다른 회원 소유
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: CRACKCS_SESSION
  parameters:
    AnswerIdPath:
      name: answerId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    QuestionIdPath:
      name: questionId
      in: path
      required: true
      description: 문제 ID
      schema:
        type: integer
        format: int64
        minimum: 1
    MemberIdPath:
      name: memberId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    TopicIdPath:
      name: topicId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ConceptIdPath:
      name: conceptId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    DocumentIdPath:
      name: documentId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    TopicIdQuery:
      name: topicId
      in: query
      required: false
      description: Topic ID 필터
      schema:
        type: integer
        format: int64
        minimum: 1
    ParentIdQuery:
      name: parentId
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
    ActiveQuery:
      name: active
      in: query
      required: false
      schema:
        type: boolean
    DocumentStatusQuery:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/KnowledgeDocumentStatus'
    TechnologyVersionQuery:
      name: technologyVersion
      in: query
      required: false
      schema:
        type: string
        maxLength: 100
    StatusQuery:
      name: status
      in: query
      required: false
      description: 문제 상태 필터
      schema:
        $ref: '#/components/schemas/QuestionStatus'
    DifficultyQuery:
      name: difficulty
      in: query
      required: false
      description: 난이도 필터
      schema:
        $ref: '#/components/schemas/QuestionDifficulty'
    OriginQuery:
      name: origin
      in: query
      required: false
      description: 출처 필터
      schema:
        $ref: '#/components/schemas/QuestionOrigin'
    PageQuery:
      name: page
      in: query
      required: false
      description: 0부터 시작하는 페이지 번호
      schema:
        type: integer
        minimum: 0
        default: 0
    SizeQuery:
      name: size
      in: query
      required: false
      description: 페이지 크기
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SortQuery:
      name: sort
      in: query
      required: false
      description: '정렬 조건. 허용 필드: id, topicId, origin, difficulty, status, createdAt, updatedAt. 형식: property,(asc|desc). 여러 조건은 반복해서 전달한다.'
      schema:
        type: array
        items:
          type: string
        default:
          - id,asc
      style: form
      explode: true
    PublicSortQuery:
      name: sort
      in: query
      required: false
      description: '정렬 조건. 허용 필드: id, difficulty, createdAt. 형식: property,(asc|desc). 여러 조건은 반복해서 전달한다.'
      schema:
        type: array
        items:
          type: string
        default:
          - id,asc
      style: form
      explode: true
  responses:
    BadRequest:
      description: 요청 형식 또는 검증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    QuestionNotFound:
      description: 해당 ID의 문제가 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            code: QUESTION_NOT_FOUND
            message: 'Question not found: 999'
            fieldErrors: []
            requestId: 1e85b909-2114-47be-a1c3-1fa47a4a7235
    Unauthorized:
      description: 인증이 필요함
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Forbidden:
      description: 인증됐지만 역할 또는 소유권이 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    InvalidCredentials:
      description: 이메일 또는 비밀번호가 올바르지 않거나 회원이 비활성 상태임
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    DuplicateAuthAccount:
      description: 같은 LOCAL 이메일 계정이 이미 존재함
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    ContentConflict:
      description: 중복 코드·원문 또는 현재 상태에서 허용되지 않는 전이
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
  schemas:
    AnswerResponse:
      type: object
      required: [answerId, evaluationId, questionId, questionContent, content, submittedAt, evaluation]
      properties:
        answerId:
          type: integer
          format: int64
        evaluationId:
          type: integer
          format: int64
        questionId:
          type: integer
          format: int64
        questionContent:
          type: string
        content:
          type: string
        submittedAt:
          type: string
          description: 서버 LocalDateTime, ISO-8601 offset 없는 시각
        evaluation:
          $ref: '#/components/schemas/EvaluationResponse'
    AnswerPageResponse:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/AnswerResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    EvaluationResponse:
      type: object
      required: [status, verdict, score, feedback, failureReason, concepts, strengths, omissions, misconceptions, evidence]
      properties:
        status:
          type: string
          enum: [EVALUATING, PROCESSING, EVALUATED, NEEDS_REVIEW, FAILED]
        verdict:
          type: [string, 'null']
          enum: [CORRECT, PARTIALLY_CORRECT, INCORRECT, NEEDS_REVIEW, null]
        score:
          type: [integer, 'null']
          enum: [100, 50, 0, null]
        feedback:
          type: [string, 'null']
        failureReason:
          type: [string, 'null']
          enum: [PROVIDER_ERROR, PROVIDER_TIMEOUT, INVALID_RESULT, PROVIDER_UNAVAILABLE, EVIDENCE_NOT_FOUND, EVIDENCE_CONFLICT, MONTHLY_BUDGET_EXCEEDED, null]
        concepts:
          type: array
          items:
            type: object
            required: [conceptId, conceptName, verdict, score, feedback]
            properties:
              conceptId:
                type: integer
                format: int64
              conceptName:
                type: string
              verdict:
                type: string
                enum: [CORRECT, PARTIALLY_CORRECT, INCORRECT, NEEDS_REVIEW]
              score:
                type: [integer, 'null']
                enum: [100, 50, 0, null]
              feedback:
                type: string
        strengths:
          type: array
          items: { type: string }
        omissions:
          type: array
          items: { type: string }
        misconceptions:
          type: array
          items: { type: string }
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationEvidenceResponse'
    SignUpRequest:
      type: object
      required: [email, password, nickname]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 15
          maxLength: 64
          description: 제어 문자가 없고 UTF-8 기준 72 byte 이하인 passphrase
        nickname:
          type: string
          minLength: 1
          maxLength: 100
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    MemberResponse:
      type: object
      required: [id, nickname, role, status]
      properties:
        id:
          type: integer
          format: int64
        nickname:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
        status:
          type: string
          enum: [ACTIVE, BLOCKED, WITHDRAWN]
    MemberStatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACTIVE, BLOCKED, WITHDRAWN]
    MemberPageResponse:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/MemberResponse'
    TopicRequest:
      type: object
      required: [code, name]
      properties:
        parentId:
          type: [integer, 'null']
          format: int64
          minimum: 1
        code:
          type: string
          maxLength: 50
        name:
          type: string
          maxLength: 100
    TopicResponse:
      type: object
      required: [id, parentId, code, name, active]
      properties:
        id:
          type: integer
          format: int64
        parentId:
          type: [integer, 'null']
          format: int64
        code:
          type: string
        name:
          type: string
        active:
          type: boolean
    TopicPageResponse:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/TopicResponse'
    ConceptRequest:
      type: object
      required: [topicId, code, name]
      properties:
        topicId:
          type: integer
          format: int64
          minimum: 1
        code:
          type: string
          maxLength: 100
        name:
          type: string
          maxLength: 150
        description:
          type: [string, 'null']
    ConceptResponse:
      type: object
      required: [id, topicId, code, name, description, active]
      properties:
        id:
          type: integer
          format: int64
        topicId:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        description:
          type: [string, 'null']
        active:
          type: boolean
    ConceptPageResponse:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/ConceptResponse'
    KnowledgeDocumentRequest:
      type: object
      required: [topicId, title, sourceType, content]
      properties:
        topicId:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          maxLength: 255
        sourceType:
          $ref: '#/components/schemas/KnowledgeSourceType'
        sourceUrl:
          type: [string, 'null']
          format: uri
          maxLength: 1000
        technologyVersion:
          type: [string, 'null']
          maxLength: 100
        licenseNote:
          type: [string, 'null']
          maxLength: 500
        content:
          type: string
          minLength: 1
    KnowledgeDocumentResponse:
      type: object
      required: [id, topicId, createdByMemberId, title, sourceType, versionSeriesId, documentVersion, content, checksum, status, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        topicId: { type: integer, format: int64 }
        createdByMemberId: { type: integer, format: int64 }
        reviewedByMemberId: { type: [integer, 'null'], format: int64 }
        title: { type: string }
        sourceType: { $ref: '#/components/schemas/KnowledgeSourceType' }
        sourceUrl: { type: [string, 'null'] }
        versionSeriesId: { type: string, format: uuid }
        documentVersion: { type: integer, minimum: 1 }
        technologyVersion: { type: [string, 'null'] }
        licenseNote: { type: [string, 'null'] }
        content: { type: string }
        checksum: { type: string, pattern: '^[0-9a-f]{64}$' }
        status: { $ref: '#/components/schemas/KnowledgeDocumentStatus' }
        reviewedAt: { type: [string, 'null'] }
        createdAt: { type: string }
        updatedAt: { type: string }
    KnowledgeDocumentPageResponse:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/KnowledgeDocumentResponse'
    KnowledgeChunkResponse:
      type: object
      required: [id, sequenceNo, startOffset, endOffset, content, checksum, generationKey, searchStatus]
      properties:
        id: { type: integer, format: int64 }
        sequenceNo: { type: integer, minimum: 0 }
        startOffset: { type: integer, minimum: 0 }
        endOffset: { type: integer, minimum: 1 }
        content: { type: string }
        checksum: { type: string }
        generationKey: { type: string }
        searchStatus:
          type: string
          enum: [KEYWORD_SEARCHABLE, EMBEDDING_PENDING, EMBEDDING_FAILED, READY]
    ChunkGenerationResponse:
      type: object
      required: [generationKey, reused, chunks]
      properties:
        generationKey: { type: string }
        reused: { type: boolean }
        chunks:
          type: array
          items: { $ref: '#/components/schemas/KnowledgeChunkResponse' }
    EvaluationEvidenceResponse:
      type: object
      required: [chunkId, documentTitle, documentVersion, startOffset, endOffset, content]
      properties:
        chunkId: { type: integer, format: int64 }
        documentTitle: { type: string }
        documentVersion: { type: integer, minimum: 1 }
        startOffset: { type: integer, minimum: 0 }
        endOffset: { type: integer, minimum: 1 }
        content: { type: string }
    AdminEvaluationSummaryResponse:
      type: object
      required: [evaluationId, answerId, questionId, status, failureCode, modelName, evaluatorVersion, occurredAt]
      properties:
        evaluationId: { type: integer, format: int64 }
        answerId: { type: integer, format: int64 }
        questionId: { type: integer, format: int64 }
        status: { type: string, enum: [FAILED, NEEDS_REVIEW] }
        failureCode: { type: [string, 'null'] }
        modelName: { type: [string, 'null'] }
        evaluatorVersion: { type: [string, 'null'] }
        occurredAt: { type: [string, 'null'] }
    AdminEvaluationDetailResponse:
      allOf:
        - $ref: '#/components/schemas/AdminEvaluationSummaryResponse'
        - type: object
          required: [questionContent, answerContent, evidence]
          properties:
            questionContent: { type: string }
            answerContent: { type: string }
            evidence:
              type: array
              items: { $ref: '#/components/schemas/EvaluationEvidenceResponse' }
    AdminEvaluationPageResponse:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/AdminEvaluationSummaryResponse' }
    PageMetadata:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    CsrfTokenResponse:
      type: object
      required: [token, headerName]
      properties:
        token:
          type: string
        headerName:
          type: string
          example: X-CSRF-TOKEN
    PublicTopicResponse:
      type: object
      required:
        - id
        - code
        - name
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
    PublicQuestionResponse:
      type: object
      required:
        - id
        - topic
        - difficulty
        - content
      properties:
        id:
          type: integer
          format: int64
        topic:
          $ref: '#/components/schemas/PublicTopicResponse'
        difficulty:
          $ref: '#/components/schemas/QuestionDifficulty'
        content:
          type: string
      description: 모범 답안과 Concept 평가 정보는 공개 응답에 포함하지 않는다.
    PublicQuestionPageResponse:
      type: object
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PublicQuestionResponse'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    QuestionCreateRequest:
      type: object
      required:
        - topicId
        - difficulty
        - content
        - referenceAnswer
      properties:
        topicId:
          type: integer
          format: int64
          minimum: 1
        difficulty:
          $ref: '#/components/schemas/QuestionDifficulty'
        content:
          type: string
          minLength: 1
        referenceAnswer:
          type: string
          minLength: 1
      example:
        topicId: 1
        difficulty: BASIC
        content: 프로세스와 스레드의 차이를 설명하세요.
        referenceAnswer: 프로세스는 자원을 독립적으로 소유하고 스레드는 프로세스 자원을 공유합니다.
    QuestionUpdateRequest:
      type: object
      required:
        - topicId
        - difficulty
        - content
        - referenceAnswer
      properties:
        topicId:
          type: integer
          format: int64
          minimum: 1
        difficulty:
          $ref: '#/components/schemas/QuestionDifficulty'
        content:
          type: string
          minLength: 1
        referenceAnswer:
          type: string
          minLength: 1
    QuestionVersionRequest:
      type: object
      required: [difficulty, content, referenceAnswer]
      properties:
        difficulty:
          $ref: '#/components/schemas/QuestionDifficulty'
        content:
          type: string
          minLength: 1
        referenceAnswer:
          type: string
          minLength: 1
    QuestionConceptReplaceRequest:
      type: object
      required: [concepts]
      properties:
        concepts:
          type: array
          items:
            type: object
            required: [conceptId, weight, required]
            properties:
              conceptId:
                type: integer
                format: int64
                minimum: 1
              weight:
                type: number
                exclusiveMinimum: 0
                maximum: 1
                multipleOf: 0.01
              required:
                type: boolean
    QuestionConceptResponse:
      type: object
      required: [conceptId, code, name, weight, required]
      properties:
        conceptId: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        weight: { type: number }
        required: { type: boolean }
    QuestionResponse:
      type: object
      required:
        - id
        - topicId
        - origin
        - type
        - difficulty
        - content
        - referenceAnswer
        - status
        - versionSeriesId
        - questionVersion
        - concepts
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
        topicId:
          type: integer
          format: int64
        origin:
          $ref: '#/components/schemas/QuestionOrigin'
        type:
          $ref: '#/components/schemas/QuestionType'
        difficulty:
          $ref: '#/components/schemas/QuestionDifficulty'
        content:
          type: string
        referenceAnswer:
          type: string
        status:
          $ref: '#/components/schemas/QuestionStatus'
        versionSeriesId:
          type: string
          format: uuid
        questionVersion:
          type: integer
          minimum: 1
        createdByMemberId:
          type: [integer, 'null']
          format: int64
        reviewedByMemberId:
          type: [integer, 'null']
          format: int64
        reviewedAt:
          type: [string, 'null']
        concepts:
          type: array
          items:
            $ref: '#/components/schemas/QuestionConceptResponse'
        createdAt:
          type: string
          description: 서버 로컬 시간 기준 ISO-8601 날짜와 시간
          example: '2026-08-30T22:50:00.123456'
        updatedAt:
          type: string
          description: 서버 로컬 시간 기준 ISO-8601 날짜와 시간
          example: '2026-08-30T22:50:00.123456'
    QuestionPageResponse:
      type: object
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/QuestionSummaryResponse'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    QuestionSummaryResponse:
      type: object
      required: [id, topicId, origin, difficulty, content, status, questionVersion, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        topicId: { type: integer, format: int64 }
        origin: { $ref: '#/components/schemas/QuestionOrigin' }
        difficulty: { $ref: '#/components/schemas/QuestionDifficulty' }
        content: { type: string }
        status: { $ref: '#/components/schemas/QuestionStatus' }
        questionVersion: { type: integer, minimum: 1 }
        createdAt: { type: string }
        updatedAt: { type: string }
    ApiErrorResponse:
      type: object
      required:
        - code
        - message
        - fieldErrors
        - requestId
      properties:
        code:
          type: string
        message:
          type: string
        fieldErrors:
          type: array
          items:
