openapi: 3.1.0
info:
  title: CrackCS Question API
  version: 1.0.0
  description: 공개 문제 조회와 관리자용 Question 관리 API
servers:
  - url: /
tags:
  - name: Public Questions
    description: 학습자에게 공개된 문제 조회
  - name: Admin Questions
    description: 관리자 문제 관리
paths:
  /api/questions:
    get:
      tags:
        - Public Questions
      operationId: findPublicQuestions
      summary: 공개 문제 목록 조회
      description: PUBLISHED 상태인 문제만 페이지 단위로 조회한다.
      parameters:
        - $ref: '#/components/parameters/TopicIdQuery'
        - $ref: '#/components/parameters/DifficultyQuery'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - $ref: '#/components/parameters/PublicSortQuery'
      responses:
        '200':
          description: 공개 문제 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicQuestionPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/questions/{questionId}:
    parameters:
      - $ref: '#/components/parameters/QuestionIdPath'
    get:
      tags:
        - Public Questions
      operationId: findPublicQuestionById
      summary: 공개 문제 상세 조회
      description: PUBLISHED 상태인 문제만 조회하며, 비공개 문제와 존재하지 않는 문제를 동일하게 처리한다.
      responses:
        '200':
          description: 공개 문제 상세 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicQuestionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/QuestionNotFound'
  /api/admin/questions:
    get:
      tags:
        - Admin Questions
      operationId: findQuestions
      summary: 문제 목록 조회
      description: 조건에 맞는 문제를 페이지 단위로 조회한다.
      parameters:
        - $ref: '#/components/parameters/TopicIdQuery'
        - $ref: '#/components/parameters/StatusQuery'
        - $ref: '#/components/parameters/DifficultyQuery'
        - $ref: '#/components/parameters/OriginQuery'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - $ref: '#/components/parameters/SortQuery'
      responses:
        '200':
          description: 문제 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags:
        - Admin Questions
      operationId: createQuestion
      summary: 초안 문제 등록
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionCreateRequest'
      responses:
        '201':
          description: 문제 등록 성공
          headers:
            Location:
              description: 생성된 문제의 URI
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/admin/questions/{questionId}:
    parameters:
      - $ref: '#/components/parameters/QuestionIdPath'
    get:
      tags:
        - Admin Questions
      operationId: findQuestionById
      summary: 문제 상세 조회
      responses:
        '200':
          description: 문제 상세 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/QuestionNotFound'
    patch:
      tags:
        - Admin Questions
      operationId: updateQuestion
      summary: 초안 문제 수정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionUpdateRequest'
      responses:
        '200':
          description: 문제 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/QuestionNotFound'
components:
  parameters:
    QuestionIdPath:
      name: questionId
      in: path
      required: true
      description: 문제 ID
      schema:
        type: integer
        format: int64
        minimum: 1
    TopicIdQuery:
      name: topicId
      in: query
      required: false
      description: Topic ID 필터
      schema:
        type: integer
        format: int64
        minimum: 1
    StatusQuery:
      name: status
      in: query
      required: false
      description: 문제 상태 필터
      schema:
        $ref: '#/components/schemas/QuestionStatus'
    DifficultyQuery:
      name: difficulty
      in: query
      required: false
      description: 난이도 필터
      schema:
        $ref: '#/components/schemas/QuestionDifficulty'
    OriginQuery:
      name: origin
      in: query
      required: false
      description: 출처 필터
      schema:
        $ref: '#/components/schemas/QuestionOrigin'
    PageQuery:
      name: page
      in: query
      required: false
      description: 0부터 시작하는 페이지 번호
      schema:
        type: integer
        minimum: 0
        default: 0
    SizeQuery:
      name: size
      in: query
      required: false
      description: 페이지 크기
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SortQuery:
      name: sort
      in: query
      required: false
      description: '정렬 조건. 허용 필드: id, topicId, origin, difficulty, status, createdAt, updatedAt. 형식: property,(asc|desc). 여러 조건은 반복해서 전달한다.'
      schema:
        type: array
        items:
          type: string
        default:
          - id,asc
      style: form
      explode: true
    PublicSortQuery:
      name: sort
      in: query
      required: false
      description: '정렬 조건. 허용 필드: id, difficulty, createdAt. 형식: property,(asc|desc). 여러 조건은 반복해서 전달한다.'
      schema:
        type: array
        items:
          type: string
        default:
          - id,asc
      style: form
      explode: true
  responses:
    BadRequest:
      description: 요청 형식 또는 검증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    QuestionNotFound:
      description: 해당 ID의 문제가 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            code: QUESTION_NOT_FOUND
            message: 'Question not found: 999'
            fieldErrors: []
            requestId: 1e85b909-2114-47be-a1c3-1fa47a4a7235
  schemas:
    PublicTopicResponse:
      type: object
      required:
        - id
        - code
        - name
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
    PublicQuestionResponse:
      type: object
      required:
        - id
        - topic
        - difficulty
        - content
      properties:
        id:
          type: integer
          format: int64
        topic:
          $ref: '#/components/schemas/PublicTopicResponse'
        difficulty:
          $ref: '#/components/schemas/QuestionDifficulty'
        content:
          type: string
      description: 모범 답안과 Concept 평가 정보는 공개 응답에 포함하지 않는다.
    PublicQuestionPageResponse:
      type: object
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PublicQuestionResponse'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    QuestionCreateRequest:
      type: object
      required:
        - topicId
        - difficulty
        - content
        - referenceAnswer
      properties:
        topicId:
          type: integer
          format: int64
          minimum: 1
        difficulty:
          $ref: '#/components/schemas/QuestionDifficulty'
        content:
          type: string
          minLength: 1
        referenceAnswer:
          type: string
          minLength: 1
      example:
        topicId: 1
        difficulty: BASIC
        content: 프로세스와 스레드의 차이를 설명하세요.
        referenceAnswer: 프로세스는 자원을 독립적으로 소유하고 스레드는 프로세스 자원을 공유합니다.
    QuestionUpdateRequest:
      type: object
      required:
        - topicId
        - difficulty
        - content
        - referenceAnswer
      properties:
        topicId:
          type: integer
          format: int64
          minimum: 1
        difficulty:
          $ref: '#/components/schemas/QuestionDifficulty'
        content:
          type: string
          minLength: 1
        referenceAnswer:
          type: string
          minLength: 1
    QuestionResponse:
      type: object
      required:
        - id
        - topicId
        - origin
        - type
        - difficulty
        - content
        - referenceAnswer
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
        topicId:
          type: integer
          format: int64
        origin:
          $ref: '#/components/schemas/QuestionOrigin'
        type:
          $ref: '#/components/schemas/QuestionType'
        difficulty:
          $ref: '#/components/schemas/QuestionDifficulty'
        content:
          type: string
        referenceAnswer:
          type: string
        status:
          $ref: '#/components/schemas/QuestionStatus'
        createdAt:
          type: string
          description: 서버 로컬 시간 기준 ISO-8601 날짜와 시간
          example: '2026-08-30T22:50:00.123456'
        updatedAt:
          type: string
          description: 서버 로컬 시간 기준 ISO-8601 날짜와 시간
          example: '2026-08-30T22:50:00.123456'
    QuestionPageResponse:
      type: object
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/QuestionResponse'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    ApiErrorResponse:
      type: object
      required:
        - code
        - message
        - fieldErrors
        - requestId
      properties:
        code:
          type: string
        message:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldErrorResponse'
        requestId:
          type: string
          format: uuid
    FieldErrorResponse:
      type: object
      required:
        - field
        - reason
      properties:
        field:
          type: string
        reason:
          type: string
    QuestionDifficulty:
      type: string
      enum:
        - BASIC
        - INTERMEDIATE
        - ADVANCED
    QuestionOrigin:
      type: string
      enum:
        - ADMIN
        - SYSTEM_FOLLOW_UP
    QuestionType:
      type: string
      enum:
        - NORMAL
        - FOLLOW_UP
    QuestionStatus:
      type: string
      enum:
        - DRAFT
        - PUBLISHED
        - RETIRED
