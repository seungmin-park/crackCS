# Combine with local; order: local,local-postgres.
spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:55432/${LOCAL_DATABASE_NAME:crackcs_local}
    username: crackcs_local
    password: crackcs-local-only
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: false
server:
  address: 127.0.0.1
crackcs:
  evaluation:
    openai:
      enabled: ${OPENAI_EVALUATION_ENABLED:false}
      api-key: ${OPENAI_API_KEY:}
    monthly-budget-usd: ${OPENAI_MONTHLY_BUDGET_USD:2}
  followup:
    openai:
      enabled: ${OPENAI_FOLLOWUP_ENABLED:false}
