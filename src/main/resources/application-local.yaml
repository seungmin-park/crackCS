spring:
  datasource:
    url: jdbc:h2:file:./data/crackcs-local;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
  sql:
    init:
      mode: always
      data-locations: classpath:db/local/data-local.sql
  h2:
    console:
      enabled: true
server:
  address: 127.0.0.1
management:
  server:
    address: 127.0.0.1
crackcs:
  security:
    allowed-hosts: localhost,127.0.0.1,[::1]
