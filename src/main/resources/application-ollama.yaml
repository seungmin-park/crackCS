crackcs:
  evaluation:
    lease-duration: 4m
    ollama:
      enabled: true
      endpoint: ${OLLAMA_CHAT_ENDPOINT:http://127.0.0.1:11434/api/chat}
      model: ${OLLAMA_MODEL:gpt-oss:20b}
      evaluator-version: ${OLLAMA_EVALUATOR_VERSION:os-evaluator-v1}
      reasoning-effort: ${OLLAMA_REASONING_EFFORT:medium}
      timeout: ${OLLAMA_TIMEOUT:3m}
    input-usd-per-million-tokens: 0
    output-usd-per-million-tokens: 0
