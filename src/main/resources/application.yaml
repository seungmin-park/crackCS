spring:
  application:
    name: crackCS
  task:
    scheduling:
      pool:
        size: 2
  data:
    web:
      pageable:
        max-page-size: 100
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        name: CRACKCS_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
crackcs:
  evaluation:
    openai:
      enabled: false
  followup:
    openai:
      enabled: false
