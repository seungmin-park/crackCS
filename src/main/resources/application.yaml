spring:
  application:
    name: crackCS
  data:
    web:
      pageable:
        max-page-size: 100
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        name: CRACKCS_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
